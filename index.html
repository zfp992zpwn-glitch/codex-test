<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投資ポートフォリオ管理アプリ</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>投資ポートフォリオ管理アプリ</h1>
    <p>価格更新と手入力を組み合わせて、資産をまとめて管理</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>価格更新設定</h2>
      <div class="inline-form api-form">
        <label>
          Alpha Vantage APIキー
          <input id="alpha-vantage-api-key" type="password" placeholder="任意（米国株・ETFの自動取得用）" />
        </label>
        <button type="button" id="save-api-key" class="btn secondary">APIキー保存</button>
        <button type="button" id="refresh-prices" class="btn primary">価格を更新</button>
      </div>
      <p id="price-update-status" class="status-text">価格更新はまだ実行されていません。</p>
    </section>

    <section class="card">
      <h2>保有銘柄を追加・編集</h2>
      <form id="asset-form" class="grid-form">
        <input type="hidden" id="asset-id" />

        <label>
          銘柄名
          <input id="name" type="text" required placeholder="例: eMAXIS Slim 全世界株式" />
        </label>

        <label>
          種類
          <select id="type" required>
            <option value="投資信託">投資信託</option>
            <option value="ETF">ETF</option>
            <option value="個別株">個別株</option>
            <option value="暗号資産">暗号資産</option>
            <option value="現金">現金</option>
          </select>
        </label>

        <label id="ticker-wrap">
          ティッカー
          <input id="ticker" type="text" placeholder="例: VTI / AAPL / BTC / ETH" />
        </label>

        <label id="units-wrap">
          保有口数
          <input id="units" type="number" min="0" step="0.0001" placeholder="例: 120000" />
        </label>

        <label id="quantity-wrap" class="hidden">
          保有数量
          <input id="quantity" type="number" min="0" step="0.00000001" placeholder="例: 10" />
        </label>

        <label id="avg-nav-wrap">
          平均取得基準価額
          <input id="avg-nav" type="number" min="0" step="0.0001" placeholder="例: 18750" />
        </label>

        <label id="current-nav-wrap">
          現在の基準価額
          <input id="current-nav" type="number" min="0" step="0.0001" placeholder="例: 21340" />
        </label>

        <label id="avg-price-wrap" class="hidden">
          平均取得単価
          <input id="avg-price" type="number" min="0" step="0.0001" placeholder="例: 280.5" />
        </label>

        <label id="current-price-wrap" class="hidden">
          現在価格
          <input id="current-price" type="number" min="0" step="0.0001" placeholder="例: 312.2" />
        </label>

        <label id="cash-amount-wrap" class="hidden">
          金額（現金）
          <input id="cash-amount" type="number" min="0" step="1" placeholder="例: 300000" />
        </label>

        <label>
          毎月の積立額（円）
          <input id="monthly" type="number" min="0" step="1" required placeholder="例: 30000" />
        </label>

        <label class="full-width">
          メモ
          <textarea id="memo" rows="3" placeholder="投資方針や目標など"></textarea>
        </label>

        <div class="actions full-width">
          <button type="submit" class="btn primary">保存</button>
          <button type="button" id="cancel-edit" class="btn secondary hidden">編集をキャンセル</button>
        </div>
      </form>
    </section>

    <section class="card summary-card">
      <h2>総資産額</h2>
      <p id="total-assets" class="total-value">¥0</p>
    </section>

    <section class="card">
      <h2>登録銘柄一覧</h2>
      <div id="asset-list" class="asset-list"></div>
    </section>

    <section class="card">
      <h2>資産配分（評価額ベース）</h2>
      <div class="chart-wrap"><canvas id="allocation-chart"></canvas></div>
    </section>

    <section class="card">
      <h2>毎月の総資産推移</h2>
      <form id="monthly-total-form" class="inline-form">
        <label>
          月（YYYY-MM）
          <input id="total-month" type="month" required />
        </label>
        <label>
          総資産額（円）
          <input id="total-amount" type="number" min="0" step="1" required />
        </label>
        <button type="submit" class="btn primary">追加</button>
      </form>
      <div id="monthly-total-list" class="simple-list"></div>
      <div class="chart-wrap"><canvas id="total-trend-chart"></canvas></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
