<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人生逃げ切り診断</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="hero">
    <h1>人生逃げ切り診断</h1>
    <p>年収・税金・投資・副業から、週5労働を脱出できる年齢を逆算する</p>
  </header>

  <main class="container">
    <section class="card"><h2>1. 基本情報</h2><div class="grid">
      <label>現在年齢<input id="currentAge" type="number" min="15" max="80"></label>
      <label>目標年齢<input id="targetAge" type="number" min="15" max="90"></label>
      <label>現在資産(円)<input id="currentAssets" type="number" min="0"></label>
      <label>想定年利(%)<input id="annualReturn" type="number" min="0" step="0.1"></label>
    </div></section>

    <section class="card"><h2>2. 職業ルート / 3. 年収ルート</h2><div class="grid">
      <label>職業ルート<select id="jobRoute"></select></label>
      <label>20代前半の年収<input id="income20early" type="number" min="0"></label>
      <label>20代後半の年収<input id="income20late" type="number" min="0"></label>
      <label>30代前半の年収<input id="income30early" type="number" min="0"></label>
      <label>30代後半の年収<input id="income30late" type="number" min="0"></label>
      <label>40代以降の年収<input id="income40plus" type="number" min="0"></label>
    </div></section>

    <section class="card"><h2>4. 税金・社会保険設定（簡易推定）</h2><div class="grid">
      <label>税モード<select id="taxMode"><option value="auto">自動推定</option><option value="manual">手動入力</option></select></label>
      <label>手取り率(%)<input id="manualTakeHomeRate" type="number" min="30" max="100"></label>
    </div><p class="note">※ 税金・社会保険は簡易推定であり、正確な税額計算ではありません。</p></section>

    <section class="card"><h2>5. 支出設定</h2><div class="grid">
      <label>生活費モード<select id="expenseMode"><option value="manual">月生活費を直接入力</option><option value="auto">内訳から自動計算</option></select></label>
      <label>月生活費(円)<input id="monthlyLivingCost" type="number" min="0"></label>
      <label>家賃(円)<input id="rent" type="number" min="0"></label>
      <label>固定費(円)<input id="fixedCost" type="number" min="0"></label>
      <label>趣味・交際費(円)<input id="hobbyCost" type="number" min="0"></label>
      <label>年間特別支出(円)<input id="annualSpecial" type="number" min="0"></label>
    </div></section>

    <section class="card"><h2>6. 投資設定</h2><div class="grid">
      <label>投資モード<select id="investMode"><option value="auto">自動計算</option><option value="manual">手動入力</option></select></label>
      <label>毎月投資額(円)<input id="manualInvestment" type="number" min="0"></label>
    </div></section>

    <section class="card"><h2>7. 副業設定</h2><div class="grid">
      <label>現在の副業月収(円)<input id="sideIncome" type="number" min="0"></label>
      <label>副業月収の年間成長率(%)<input id="sideGrowth" type="number" min="0"></label>
      <label>副業月収の上限(円)<input id="sideCap" type="number" min="0"></label>
      <label>副業手取り率(%)<input id="sideTakeHomeRate" type="number" min="0" max="100"></label>
    </div></section>

    <section class="card"><h2>8. 労働単価設定</h2><div class="grid">
      <label>1日あたりの手取り収入(円)<input id="dailyTakeHome" type="number" min="1"></label>
      <label>週何日までなら働いてもよいか<input id="acceptableDays" type="number" min="0" max="7" step="0.5"></label>
    </div><button id="calcBtn" class="btn">診断する</button></section>

    <section class="card highlight"><div class="kpi"><h3>人生逃げ切りスコア</h3><p id="score">-</p></div><div class="kpi"><h3>週5脱出年齢</h3><p id="escape5">-</p></div><div class="kpi"><h3>完全FIRE年齢</h3><p id="fireAge">-</p></div></section>
    <section class="card" id="resultText"></section>

    <section class="card"><h2>グラフ</h2>
      <div class="chart"><canvas id="assetChart"></canvas></div>
      <div class="chart"><canvas id="incomeChart"></canvas></div>
      <div class="chart"><canvas id="investChart"></canvas></div>
      <div class="chart"><canvas id="escapeChart"></canvas></div>
      <div class="chart"><canvas id="ratioChart"></canvas></div>
      <div class="chart"><canvas id="scenarioChart"></canvas></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
